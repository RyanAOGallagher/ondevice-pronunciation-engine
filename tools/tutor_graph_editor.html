<title>Tutor Graph Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap">
<style>
  :root { --ink:#0A0A0A; --mut:#8A8A8E; --hair:#ECECEE; --soft:#F5F5F6; --auto:#C9C9CC; --or:#F97316; --gr:#16A34A; --am:#D97706; --bg:#FFFFFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#F4F4F5; --mut:#8A8A8E; --hair:#26262A; --soft:#18181B; --auto:#3F3F46; --bg:#0A0A0A; } }
  :root[data-theme="dark"] { --ink:#F4F4F5; --mut:#8A8A8E; --hair:#26262A; --soft:#18181B; --auto:#3F3F46; --bg:#0A0A0A; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Geist','Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .mono { font-family:'Geist Mono',ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; }
  .page { min-height:100%; display:flex; flex-direction:column; padding-block:0; }
  header { display:flex; align-items:flex-end; gap:24px; padding:40px max(16px,4.4vw) 0; }
  .eyebrow { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); }
  #sentence { font:300 34px/1.1 'Geist',system-ui,sans-serif; letter-spacing:-.01em; border:0; outline:0; background:transparent; color:var(--ink); width:100%; padding:0; margin-top:10px; }
  #sentence::placeholder { color:var(--auto); }
  .meta { font-size:12px; color:var(--mut); margin-top:8px; }
  main { flex:1; padding:36px max(16px,4.4vw) 120px; display:flex; flex-direction:column; gap:18px; }
  .ruler { position:relative; height:16px; }
  .ruler span { position:absolute; top:0; transform:translateX(-50%); font-size:10.5px; color:var(--mut); }
  .track { position:relative; }
  canvas { display:block; width:100%; }
  #wave { height:72px; }
  #graph { height:240px; border-radius:10px; }
  .words { position:relative; height:40px; }
  .words div { position:absolute; top:0; height:40px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; }
  .words i { width:5px; height:5px; border-radius:50%; background:var(--or); }
  .bnd { position:absolute; top:0; bottom:0; width:0; border-left:1px dashed var(--auto); pointer-events:none; }
  .handle { position:absolute; top:-4px; width:9px; height:9px; border-radius:50%; background:var(--bg); border:1.5px solid var(--ink); transform:translateX(-5px); cursor:ew-resize; touch-action:none; }
  .handle.on { background:var(--ink); }
  .wordline { font-size:13px; line-height:1.6; display:flex; gap:22px; flex-wrap:wrap; color:var(--mut); }
  .wordline b { font-weight:500; color:var(--ink); }
  .hint { font-size:13px; color:var(--mut); min-height:20px; }
  .hint em { font-style:normal; color:var(--or); }
  footer { display:flex; align-items:center; gap:24px; padding:16px max(16px,4.4vw); border-top:1px solid var(--hair); font-size:13px; }
  footer .json { flex:1; font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  footer button { background:none; border:0; color:var(--ink); font:inherit; font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer; padding:0; }
  .toolbar { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; align-items:center; gap:4px; padding:6px 8px; background:var(--bg); border:1px solid var(--hair); border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04); }
  .toolbar button { display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 14px; border-radius:8px; border:0; background:none; color:var(--ink); font:inherit; cursor:pointer; min-width:44px; }
  .toolbar button span { font-size:11px; color:var(--mut); }
  .toolbar button:disabled { opacity:.35; cursor:default; }
  .toolbar button.on { background:var(--soft); color:var(--or); } .toolbar button.on span { color:var(--or); }
  .toolbar button:focus-visible { outline:2px solid var(--or); outline-offset:2px; }
  .toolbar .sep { width:1px; height:28px; background:var(--hair); margin:0 4px; }
  .toolbar .time { font-size:12px; color:var(--mut); padding:0 8px 0 2px; min-width:44px; }
  .drop { flex:1; display:flex; align-items:center; justify-content:center; }
  .drop label { width:min(520px,100%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height:240px; border:1px dashed var(--auto); border-radius:16px; color:var(--mut); cursor:pointer; }
  .drop label b { font-size:16px; font-weight:300; color:var(--ink); }
  .drop input { display:none; }
  .primary { height:36px; padding:0 18px; border-radius:999px; background:var(--ink); color:var(--bg); border:0; font:500 13px 'Geist',system-ui,sans-serif; cursor:pointer; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div class="page">
  <header>
    <div style="flex:1; min-width:0;">
      <div class="eyebrow">Tutor graph</div>
      <input id="sentence" placeholder="Type the sentence, e.g. I see stars." autocomplete="off" spellcheck="false">
      <div class="meta mono" id="meta">no clip loaded</div>
    </div>
    <div style="display:flex; align-items:center; gap:24px; padding-bottom:4px;">
      <button id="sample" style="background:none; border:0; font:inherit; font-size:13px; color:var(--mut); cursor:pointer; padding:0;">Test clip</button>
      <label class="primary" for="file" style="display:inline-flex; align-items:center;">Open audio…</label>
    </div>
  </header>

  <div class="drop" id="drop">
    <label for="file">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4l4 4M4 20h16"/></svg>
      <b>Drop the native MP3 or WAV</b>
      <span>any sample rate · resampled to 16 kHz</span>
      <input id="file" type="file" accept="audio/*">
    </label>
  </div>

  <main id="editor" hidden>
    <div class="ruler" id="ruler"></div>
    <div class="track" id="waveTrack"><canvas id="wave"></canvas><div id="waveBnd"></div></div>
    <div class="words" id="wordsRow"></div>
    <div class="track" id="graphTrack"><canvas id="graph"></canvas><div id="graphBnd"></div></div>
    <div class="wordline" id="wordline"></div>
    <div class="hint" id="hint"></div>
  </main>

  <footer id="foot" hidden>
    <span style="color:var(--mut);">Row JSON</span>
    <span class="json mono" id="json"></span>
    <button id="copy"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button>
  </footer>

  <div class="toolbar" id="toolbar" hidden>
    <button id="play"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg><span>Play</span></button>
    <div class="time mono" id="time">0.00 s</div>
    <div class="sep"></div>
    <button id="addAcc"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Accent</span></button>
    <button id="delAcc" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14"/></svg><span>Remove</span></button>
    <button id="recompute"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg><span>Recompute</span></button>
    <div class="sep"></div>
    <button id="undo" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Undo</span></button>
  </div>
</div>

<script>
// ---------- state ----------
const SR = 16000;
let audio = null;          // { samples: Float32Array (16 kHz), buffer: AudioBuffer, name }
let spanMs = 0;
let autoGraph = null;      // IntArray(100) from the audio
let graph = null;          // edited copy
let words = [];            // [{text, start, end}] ms
let accents = [];          // bin indices
let selected = -1;         // index into accents
let playheadMs = 0;
let undoStack = [];
const $ = id => document.getElementById(id);

// ---------- DSP: same as the engine's userGraph ----------
function boxMean(v, w) {
  const c = new Float64Array(v.length + 1);
  for (let i = 0; i < v.length; i++) c[i + 1] = c[i] + v[i];
  const out = new Float64Array(v.length);
  for (let i = 0; i < v.length; i++) { const lo = Math.max(0, i - (w >> 1)), hi = Math.min(v.length, i + w - (w >> 1)); out[i] = (c[hi] - c[lo]) / (hi - lo); }
  return out;
}
function envelope(x) {                       // 80 ms RMS, 40 ms box, max = 1
  const sq = new Float64Array(x.length); for (let i = 0; i < x.length; i++) sq[i] = x[i] * x[i];
  const r = boxMean(sq, SR * 80 / 1000); for (let i = 0; i < r.length; i++) r[i] = Math.sqrt(r[i]);
  const e = boxMean(r, SR * 40 / 1000); let m = 1e-9; for (const v of e) m = Math.max(m, v);
  for (let i = 0; i < e.length; i++) e[i] /= m; return e;
}
function toGraph100(data) {                  // port of arrayToGraphData_buffer
  const n = 100, step = data.length / 100, g = new Array(n).fill(0); let maxNum = 0;
  for (let i = 0; i < n; i++) {
    const s = Math.floor(i * step), e = Math.min(Math.floor((i + 1) * step), data.length);
    let wmax = -Infinity, wmin = Infinity, sum = 0;
    for (let k = s; k < e; k++) { const v = Math.abs(data[k]); wmax = Math.max(wmax, v); wmin = Math.min(wmin, v); sum += wmax + wmin; }
    g[i] = e > s ? sum / (e - s) * 0.02 : 0; maxNum = Math.max(maxNum, g[i]);
  }
  if (maxNum === 0) return g;
  const resize = Math.abs((100 - maxNum) / maxNum);
  return g.map(v => Math.round(maxNum < 30 ? v + v * resize : maxNum < 100 ? v : v - v * resize));
}

// ---------- load ----------
async function loadFile(file) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ac.decodeAudioData(file.bytes || await file.arrayBuffer());
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * SR), SR);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const mono = (await off.startRendering()).getChannelData(0);
  audio = { samples: mono, buffer: buf, name: file.name, ctx: ac };
  spanMs = Math.round(mono.length / SR * 1000);
  autoGraph = toGraph100(envelope(mono)); graph = autoGraph.slice();
  accents = []; selected = -1; playheadMs = 0; undoStack = [];
  if (!$('sentence').value) $('sentence').value = file.name.replace(/\.[^.]+$/, '');
  splitWords();
  $('meta').textContent = `${file.name} · ${(spanMs / 1000).toFixed(2)} s · 16 kHz`;
  $('drop').hidden = true; $('editor').hidden = false; $('foot').hidden = false; $('toolbar').hidden = false;
  buildRuler(); render();
}
$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));

function loadSample() {
  const bin = atob(SAMPLE_B64), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  $('sentence').value = 'I see stars.'; loadFile({ name: 'rs_l001_16.mp3', bytes: bytes.buffer });
}
$('sample').onclick = loadSample;
loadSample();
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// words: split the speech span evenly by word count (drag handles to correct)
function splitWords() {
  const texts = $('sentence').value.trim().split(/\s+/).filter(Boolean);
  if (!audio || !texts.length) { words = []; return; }
  const env = envelope(audio.samples); let a = 0, b = env.length - 1;
  while (a < b && env[a] < 0.06) a++; while (b > a && env[b] < 0.06) b--;
  const s0 = a / SR * 1000, s1 = b / SR * 1000, w = (s1 - s0) / texts.length;
  words = texts.map((t, i) => ({ text: t, start: Math.round(s0 + i * w), end: Math.round(s0 + (i + 1) * w) }));
}
$('sentence').addEventListener('change', () => { if (audio) { pushUndo(); splitWords(); render(); } });

// ---------- render ----------
function px(ms, el) { return ms / spanMs * el.clientWidth; }
function buildRuler() {
  const r = $('ruler'); r.innerHTML = '';
  const step = spanMs > 4000 ? 1000 : 500;
  for (let t = 0; t <= spanMs; t += step) { const s = document.createElement('span'); s.className = 'mono'; s.style.left = (t / spanMs * 100) + '%'; s.textContent = (t / 1000).toFixed(1); r.appendChild(s); }
}
function drawWave() {
  const c = $('wave'), dpr = devicePixelRatio || 1; c.width = c.clientWidth * dpr; c.height = 72 * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, c.clientWidth, 72);
  const x = audio.samples, cols = c.clientWidth, n = Math.max(1, Math.floor(x.length / cols));
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--hair');
  for (let i = 0; i < cols; i++) { let mx = 0; for (let k = i * n; k < (i + 1) * n && k < x.length; k++) mx = Math.max(mx, Math.abs(x[k])); const h = Math.max(1, mx * 34); g.fillRect(i, 36 - h, 1, 2 * h); }
  if (playheadMs > 0) { g.fillStyle = '#F97316'; g.fillRect(px(playheadMs, c), 0, 1.5, 72); }
}
function drawGraph() {
  const c = $('graph'), dpr = devicePixelRatio || 1, W = c.clientWidth, H = 240; c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), ink = cs.getPropertyValue('--ink').trim(), soft = cs.getPropertyValue('--soft').trim(), auto = cs.getPropertyValue('--auto').trim();
  g.fillStyle = soft; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(0,0,0,.035)'; for (let k = 1; k < 5; k += 2) g.fillRect(0, k * H / 5, W, H / 5);
  const X = i => (i + 0.5) * W / 100, Y = v => H - H * 0.9 * v / 100;
  const line = (arr, color, width, dash) => { g.beginPath(); g.setLineDash(dash); g.strokeStyle = color; g.lineWidth = width; g.lineJoin = g.lineCap = 'round'; arr.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); g.stroke(); g.setLineDash([]); };
  if (autoGraph.some((v, i) => v !== graph[i])) line(autoGraph, auto, 1.5, [4, 5]);
  line(graph, ink, 2, []);
  if (playheadMs > 0) { g.fillStyle = 'rgba(249,115,22,.5)'; g.fillRect(px(playheadMs, c), 0, 1, H); }
  // accent markers: hairline from the tag at the top down to the curve, small dot on the curve
  g.font = "500 11px 'Geist Mono', ui-monospace, Menlo, monospace"; g.textBaseline = 'middle';
  accents.forEach((b, i) => {
    const x = X(b), y = Y(graph[b]), on = i === selected;
    const w = words.find(w => binToMs(b) >= w.start && binToMs(b) < w.end), label = w ? w.text : String(b);
    g.strokeStyle = on ? '#F97316' : 'rgba(249,115,22,.55)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + .5, 22); g.lineTo(x + .5, y); g.stroke();
    g.beginPath(); g.arc(x, y, on ? 4 : 3, 0, 7); g.fillStyle = '#F97316'; g.fill();
    const tw = g.measureText(label).width + 14, tx = Math.max(2, Math.min(W - tw - 2, x - tw / 2));
    g.fillStyle = on ? '#F97316' : soft; g.strokeStyle = '#F97316'; g.lineWidth = 1;
    g.beginPath(); g.roundRect(tx, 6, tw, 18, 9); g.fill(); g.stroke();
    g.fillStyle = on ? '#fff' : '#F97316'; g.fillText(label, tx + 7, 15.5);
  });
}
function drawWords() {
  const row = $('wordsRow'); row.innerHTML = '';
  words.forEach((w, i) => {
    const d = document.createElement('div'); d.style.left = (w.start / spanMs * 100) + '%'; d.style.width = ((w.end - w.start) / spanMs * 100) + '%';
    d.innerHTML = `<span>${w.text}</span>`; if (accents.some(b => binToMs(b) >= w.start && binToMs(b) < w.end)) d.style.color = 'var(--or)'; row.appendChild(d);
  });
  const mk = (host, handles) => {
    host.innerHTML = '';
    words.forEach((w, i) => {
      const xs = [w.start]; if (i === words.length - 1) xs.push(w.end);
      xs.forEach((ms, k) => {
        const b = document.createElement('div'); b.className = 'bnd'; b.style.left = (ms / spanMs * 100) + '%'; host.appendChild(b);
        if (handles) { const h = document.createElement('div'); h.className = 'handle'; h.style.left = (ms / spanMs * 100) + '%'; h.dataset.word = i; h.dataset.edge = k ? 'end' : 'start'; host.appendChild(h); }
      });
    });
  };
  mk($('waveBnd'), true); mk($('graphBnd'), false);
  $('wordline').innerHTML = words.map(w => `<div><b>${w.text}</b> <span class="mono">${w.start}–${w.end}</span></div>`).join('') +
    `<div style="flex:1"></div><div class="mono">span ${spanMs} ms · accents [${accents.slice().sort((a, b) => a - b).join(', ')}]</div>`;
}
function binToMs(b) { return (b + 0.5) / 100 * spanMs; }
function msToBin(ms) { return Math.max(0, Math.min(99, Math.floor(ms / spanMs * 100))); }
function rowJson() {
  const key = $('sentence').value.trim() || audio.name;
  return JSON.stringify({ [key]: { graph, accent: accents.slice().sort((a, b) => a - b), spanMs, wordMs: words.map(w => [w.text, w.start, w.end]) } });
}
function render() {
  drawWave(); drawGraph(); drawWords();
  $('json').textContent = rowJson();
  $('delAcc').disabled = selected < 0; $('undo').disabled = !undoStack.length;
  $('time').textContent = (playheadMs / 1000).toFixed(2) + ' s';
  $('hint').innerHTML = selected >= 0 ? '<em>Accent selected</em> — drag it along the graph (snaps to the nearest peak). − removes it.' :
    accents.length ? 'Click an accent to select it. + adds one at the playhead.' : 'Play to set the playhead, then + adds an accent there.';
}
addEventListener('resize', () => audio && render());

// ---------- undo ----------
function pushUndo() { undoStack.push(JSON.stringify({ graph, words, accents })); if (undoStack.length > 50) undoStack.shift(); }
$('undo').onclick = () => { const s = undoStack.pop(); if (!s) return; ({ graph, words, accents } = JSON.parse(s)); selected = -1; render(); };

// ---------- interactions ----------
// word boundary handles (waveform)
$('waveBnd').addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h) return; e.preventDefault(); pushUndo(); h.classList.add('on'); h.setPointerCapture(e.pointerId);
  const i = +h.dataset.word, edge = h.dataset.edge, track = $('waveTrack');
  const move = ev => {
    const ms = Math.round(Math.max(0, Math.min(spanMs, (ev.clientX - track.getBoundingClientRect().left) / track.clientWidth * spanMs)));
    if (edge === 'end') words[i].end = Math.max(words[i].start + 20, ms);
    else { words[i].start = ms; if (i > 0) words[i - 1].end = ms; }
    render();
  };
  h.addEventListener('pointermove', move);
  h.addEventListener('pointerup', () => { h.removeEventListener('pointermove', move); h.classList.remove('on'); }, { once: true });
});
// graph: select/drag accents, or paint points
const gc = $('graph');
gc.addEventListener('pointerdown', e => {
  const r = gc.getBoundingClientRect(), W = gc.clientWidth, H = 240;
  const bin = Math.max(0, Math.min(99, Math.floor((e.clientX - r.left) / W * 100)));
  const hit = accents.findIndex(b => Math.abs((b + 0.5) * W / 100 - (e.clientX - r.left)) < 12);
  pushUndo(); gc.setPointerCapture(e.pointerId);
  if (hit >= 0) {                                    // drag accent along X
    selected = hit; render();
    const move = ev => { accents[selected] = Math.max(0, Math.min(99, Math.floor((ev.clientX - r.left) / W * 100))); render(); };
    gc.addEventListener('pointermove', move);
    gc.addEventListener('pointerup', () => { gc.removeEventListener('pointermove', move); accents[selected] = snapToPeak(accents[selected]); render(); }, { once: true });
  } else { undoStack.pop(); selected = -1; render(); }   // graph editing comes later
});
function snapToPeak(b) { let best = b; for (let k = Math.max(0, b - 4); k <= Math.min(99, b + 4); k++) if (graph[k] > graph[best]) best = k; return best; }
$('addAcc').onclick = () => { pushUndo(); const b = snapToPeak(msToBin(playheadMs || spanMs / 2)); if (!accents.includes(b)) accents.push(b); selected = accents.indexOf(b); render(); };
$('delAcc').onclick = () => { if (selected < 0) return; pushUndo(); accents.splice(selected, 1); selected = -1; render(); };
$('recompute').onclick = () => { pushUndo(); graph = autoGraph.slice(); render(); };
document.addEventListener('keydown', e => {
  if (e.target === $('sentence')) return;
  if (e.key === 'Escape') { selected = -1; render(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected >= 0) $('delAcc').click();
  if (e.key === '+' || e.key === '=') $('addAcc').click();
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); $('undo').click(); }
});
// play with a moving playhead
let playing = null;
$('play').onclick = () => {
  if (playing) { playing.src.stop(); return; }
  const ctx = audio.ctx; if (ctx.state === 'suspended') ctx.resume();
  const src = ctx.createBufferSource(); src.buffer = audio.buffer; src.connect(ctx.destination);
  const t0 = ctx.currentTime; src.start(); playing = { src };
  $('play').classList.add('on');
  const tick = () => { if (!playing) return; playheadMs = Math.min(spanMs, (ctx.currentTime - t0) * 1000); render(); requestAnimationFrame(tick); };
  src.onended = () => { playing = null; $('play').classList.remove('on'); render(); };
  tick();
};
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify(JSON.parse(rowJson()), null, 1)); $('copy').lastChild.textContent = 'Copied'; setTimeout(() => $('copy').lastChild.textContent = 'Copy', 1200); } catch { prompt('Copy the row JSON:', rowJson()); } };
</script>
